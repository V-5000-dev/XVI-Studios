<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRCTeach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body style="background-color: var(--color-bg)">
    <div id="header"></div>
    <div class = "stack">
  <div class = "container">
    <h1>All Dev Posts</h1>
    <section id = "devlog" data-limit = "1">
      <div id = "devlog-content"Loading...></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  const section = document.getElementById("devlog");
  const box = document.getElementById("devlog-content");
  const limit = parseInt(section.dataset.limit, 10) || Infinity;

  fetch("updates.md")
    .then((res) => {
      if (!res.ok) throw new Error("Not found");
      return res.text();
    })
    .then((text) => {
      const posts = text.split(/\n---\n/).filter((p) => p.trim());
      box.innerHTML = posts
        .slice(0, limit)
        .map((p) => "<article class='devlog-post'>" + marked.parse(p) + "</article>")
        .join("");
    })
    .catch(() => {
      box.textContent = "Couldn't load the devlog.";
    });

</script>
</div>

    </main>

    <script src="main.js"></script>
  </body>
</html>
